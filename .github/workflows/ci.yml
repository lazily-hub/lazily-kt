name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Kotlin / JVM 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The conformance replays read fixtures ONLY from the canonical sibling at
      # ../lazily-spec/conformance (#lzspecconf). lazily-kt used to bundle copies
      # under src/test/resources/conformance and fall back to them, which meant
      # whole areas the spec has but kt never bundled (message-passing, receipts)
      # silently skipped in CI while reporting green.
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # Guard the absence case: without the sibling every conformance replay
      # fails loudly now, but fail here first with an actionable message.
      - name: Guard — canonical fixtures present (#lzspecconf)
        run: |
          test -d ../lazily-spec/conformance || { echo "::error::../lazily-spec/conformance missing — the conformance replays cannot run"; exit 1; }
          test -d ../lazily-spec/conformance/message-passing || { echo "::error::../lazily-spec/conformance/message-passing missing — CommandConformanceTest would not replay"; exit 1; }
          test -f ../lazily-spec/conformance/receipts/causal_receipts.json || { echo "::error::receipts/causal_receipts.json missing — ReceiptTest would not replay"; exit 1; }
          test -d ../lazily-spec/conformance/reactive-graph || { echo "::error::../lazily-spec/conformance/reactive-graph missing — ReactiveGraphConformanceTest would not replay"; exit 1; }
          test -f ../lazily-spec/conformance/reactive-graph/transitive_invalidation_reaches_depth.json || { echo "::error::reactive-graph/transitive_invalidation_reaches_depth.json missing — the invalidation-cascade replay across the sync/thread-safe/async contexts would not run"; exit 1; }
          test -f ../lazily-spec/schemas/agent-doc-state.json || { echo "::error::schemas/agent-doc-state.json missing — the type_tag vocabulary check would not run"; exit 1; }

      - name: Build
        run: ./gradlew build --no-daemon

      - name: Test
        run: ./gradlew test --no-daemon

      # Cross-binding wire compatibility, run by `make check` and by no
      # binding's CI until now (#lzinteroppeerci). Nine bindings must agree on a
      # byte layout; a gate that only executes on a laptop is how they stop
      # agreeing without anyone noticing.
      - name: Interop peer self-check (#lzinteroppeerci)
        run: ./gradlew interopPeerCheck --no-daemon

      # An absence guard cannot catch shadowing — a replay refactored away leaves
      # the fixture dir present and CI green. Assert the fixtures actually ran.
      - name: Guard — conformance fixtures actually replayed (#lzspecconf)
        run: ./scripts/check-conformance-coverage.sh

      # The gate that keeps every step above honest (#lzcheckcireachguard). It
      # compares `make check`'s prerequisite closure against the run: bodies in
      # this file and fails on any target CI does not reach. Comments inside run:
      # bodies are stripped first — a naive grep for "make check" reported all
      # nine bindings as covered and every one of those hits was a comment.
      - name: CI-reachability guard (#lzcheckcireachguard)
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }

  lean:
    name: Lean formal models (#lzleanformal)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical lazily-spec
        uses: actions/checkout@v4
        with:
          repository: lazily-hub/lazily-spec
          path: lazily-spec

      - name: Checkout canonical lazily-formal
        uses: actions/checkout@v4
        with:
          repository: lazily-hub/lazily-formal
          path: lazily-formal

      - name: Build lazily-spec IPC formal model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lazily-spec/formal/lean
          auto-config: false
          build: true
          test: false
          lint: false

      # `make test-lean-formal` is literally `cd <spec>/formal/lean && lake build`,
      # and the reachability guard can only see commands that appear in a run:
      # body — the lake build inside lean-action above is invisible to it. This
      # step is not decoration: lean-action puts $HOME/.elan/bin on GITHUB_PATH,
      # so it runs the same command make runs, against the same checkout, and it
      # is what fails if the action ever stops building this package.
      - name: Lean formal model builds under `make test-lean-formal`
        working-directory: lazily-spec/formal/lean
        run: lake build

      - name: Build lazily-formal reactive + state-chart model
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lazily-formal
          auto-config: false
          build: true
          test: false
          lint: false

      # Same contract for `make test-lazily-formal`. The two targets build
      # different packages, so both are asserted rather than letting one stand in
      # for the other.
      - name: lazily-formal model builds under `make test-lazily-formal`
        working-directory: lazily-formal
        run: lake build
