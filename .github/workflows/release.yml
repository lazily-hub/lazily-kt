name: Release

on:
  push:
    tags:
      - "v*"

# Release builds generate protobuf sources from the same immutable spec release
# qualified by CI, including generation-fenced stale-handle disposal.
env:
  LAZILY_SPEC_REF: v0.43.0
  LAZILY_SPEC_COMMIT: 4b34879b26566a0616b97cf661ac4f1a23762af6

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fetch canonical lazily-spec protobuf sources
        run: |
          git clone --branch "$LAZILY_SPEC_REF" --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec
          test "$(git -C ../lazily-spec rev-parse HEAD)" = "$LAZILY_SPEC_COMMIT" || { echo "::error::lazily-spec $LAZILY_SPEC_REF did not resolve to pinned commit $LAZILY_SPEC_COMMIT"; exit 1; }

      - name: Publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon
